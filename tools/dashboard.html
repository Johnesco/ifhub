<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IF Hub Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0f1117; --bg-card:#181a24; --bg-hover:#1c1f2b; --bg-sel:#21243a;
  --bg-expanded:#151720; --border:#282d3e; --border-accent:#3a4060;
  --text:#c8cdd8; --text-muted:#8890a4; --text-dim:#555b70;
  --accent:#6c9eff; --accent-hover:#8cb4ff; --heading:#a0aac0;
  --term-bg:#0b0d14; --green:#34d399; --green-dim:#1a3a2e;
  --red:#f87171; --red-dim:#3a1a1a; --yellow:#fbbf24; --yellow-dim:#3a3018;
  --blue:#60a5fa; --line:#3a4060;
}
html, body { height:100%; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); font-size:15px; }

/* Header */
header { padding:12px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; background:var(--bg-card); }
header h1 { color:var(--accent); font-size:1.2em; font-weight:600; }
header .sub { color:var(--text-muted); font-size:.9em; }
header .spacer { flex:1; }
.hdr-btn { padding:6px 14px; font-size:.9em; border:1px solid var(--border-accent); background:transparent; color:var(--text-muted); border-radius:6px; cursor:pointer; font-family:inherit; transition:all .12s; }
.hdr-btn:hover { background:var(--bg-hover); border-color:var(--accent); color:var(--text); }

/* Matrix */
.matrix { width:100%; border-collapse:collapse; table-layout:fixed; }
.matrix th { text-align:left; padding:8px 12px; font-size:.8em; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.6px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:2; }
.matrix td { padding:8px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
.col-game { width:26%; } .col-engine { width:8%; } .col-status { width:11%; } .col-actions { width:10%; }
.matrix tbody tr { cursor:pointer; transition:background .08s; }
.matrix tbody tr:hover { background:var(--bg-hover); }
.matrix tbody tr.row-sel { background:var(--bg-sel); }
.game-name { color:var(--text); font-weight:600; text-decoration:none; }
.game-name:hover { color:var(--accent); }
.engine-tag { font-size:.8em; color:var(--text-muted); background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:2px 7px; white-space:nowrap; font-weight:500; }

/* Badges */
.badge { display:inline-block; font-size:.78em; font-weight:600; padding:3px 9px; border-radius:4px; letter-spacing:.3px; cursor:pointer; white-space:nowrap; transition:all .1s; text-transform:uppercase; }
.badge:hover { filter:brightness(1.2); }
.badge-present { background:var(--green-dim); color:var(--green); border:1px solid rgba(52,211,153,.2); }
.badge-missing { background:rgba(85,91,112,.15); color:var(--text-dim); border:1px solid var(--border); }
.badge-stale   { background:var(--yellow-dim); color:var(--yellow); border:1px solid rgba(251,191,36,.2); }
.badge-failed  { background:var(--red-dim); color:var(--red); border:1px solid rgba(248,113,113,.2); }
.badge-na      { background:transparent; color:var(--text-dim); border:1px solid var(--border); font-weight:normal; opacity:.5; }

/* Buttons */
.btn { padding:6px 14px; font-family:inherit; font-size:.88em; border:1px solid var(--border-accent); background:var(--bg-card); color:var(--text); border-radius:6px; cursor:pointer; white-space:nowrap; transition:all .1s; }
.btn:hover { background:var(--bg-sel); border-color:var(--accent); }
.btn:disabled { opacity:.3; cursor:default; }
.btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
.btn-primary:hover { background:var(--accent-hover); }
.force-label { font-size:.82em; color:var(--text-dim); display:flex; align-items:center; gap:4px; cursor:pointer; }
.only-link { font-size:.82em; color:var(--text-dim); cursor:pointer; text-decoration:underline; margin-left:6px; }
.only-link:hover { color:var(--text-muted); }
.play-link { font-size:.78em; color:var(--text-dim); text-decoration:none; padding:2px 6px; border:1px solid var(--border); border-radius:3px; transition:all .1s; }
.play-link:hover { color:var(--accent); border-color:var(--accent); }
.play-links { display:inline-flex; gap:4px; margin-left:8px; }

/* Expanded row */
.expanded-row td { padding:0!important; border-bottom:2px solid var(--accent); }
.expanded-content { background:var(--bg-expanded); padding:20px 28px; display:flex; gap:32px; }
.expanded-left { flex:0 0 340px; }
.expanded-right { flex:1; min-width:0; }

/* DAG */
.dag { display:flex; flex-direction:column; align-items:stretch; max-width:340px; }
.dag-node { border:1px solid var(--border); border-left:3px solid var(--text-dim); border-radius:6px; padding:10px 14px; background:var(--bg-card); }
.dag-node-present { border-left-color:var(--green); }
.dag-node-missing { border-left-color:var(--text-dim); }
.dag-node-stale   { border-left-color:var(--yellow); }
.dag-node-failed  { border-left-color:var(--red); }
.dag-node-na      { border-left-color:var(--border); opacity:.35; }
.dag-node-running { border-left-color:var(--accent); background:repeating-linear-gradient(-45deg,var(--bg-card),var(--bg-card) 8px,rgba(108,158,255,.06) 8px,rgba(108,158,255,.06) 16px); background-size:200% 100%; animation:stripe-scroll .8s linear infinite; }
@keyframes stripe-scroll { 0%{background-position:0 0} 100%{background-position:22.6px 0} }
.node-head { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.node-name { font-weight:600; font-size:1em; }
.node-badge { font-size:.75em; font-weight:600; padding:2px 8px; border-radius:4px; margin-left:auto; text-transform:uppercase; }
.node-detail { font-size:.85em; color:var(--text-muted); margin-bottom:6px; }
.node-detail a { color:var(--blue); text-decoration:none; }
.node-detail a:hover { text-decoration:underline; }
.node-btns { display:flex; gap:8px; align-items:center; }
.node-btns .spacer { flex:1; }

/* DAG connectors */
.dag-conn { height:18px; display:flex; justify-content:center; }
.dag-conn-line { width:2px; height:100%; background:var(--line); position:relative; }
.dag-conn-line::after { content:''; position:absolute; bottom:-4px; left:50%; transform:translateX(-50%); border:4px solid transparent; border-top-color:var(--line); }
.dag-phase-sep { height:24px; display:flex; align-items:center; gap:8px; margin:4px 0; }
.dag-phase-sep::before, .dag-phase-sep::after { content:''; flex:1; height:1px; background:var(--border-accent); }
.dag-phase-sep span { font-size:.75em; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; white-space:nowrap; }

/* Metadata form */
.meta-form { display:grid; grid-template-columns:auto 1fr; gap:8px 10px; align-items:center; margin-bottom:10px; padding:12px 14px; background:var(--bg-card); border:1px solid var(--border); border-radius:6px; }
.meta-form label { font-size:.85em; color:var(--text-dim); text-align:right; font-weight:500; }
.meta-form input[type="text"] { padding:6px 10px; background:var(--bg); border:1px solid var(--border); color:var(--text); font-family:inherit; font-size:.9em; border-radius:4px; }
.meta-form input[type="text"]:focus { outline:none; border-color:var(--accent); }
.meta-form .chk { grid-column:2; display:flex; align-items:center; gap:6px; font-size:.85em; color:var(--text-dim); }
.meta-form .chk input { accent-color:var(--accent); }

/* Terminal */
.output-bar { display:flex; align-items:center; gap:12px; margin-bottom:6px; margin-top:10px; }
.output-bar h4 { font-size:.92em; color:var(--heading); font-weight:600; }
.job-status { font-size:.85em; flex:1; }
.st-run { color:var(--yellow); } .st-done { color:var(--green); } .st-err { color:var(--red); }
.output-btns { display:flex; gap:6px; }
.term { background:var(--term-bg); border:1px solid var(--border); border-radius:6px; padding:12px 14px; font-family:"SF Mono","Cascadia Code",Consolas,monospace; font-size:13px; line-height:1.6; height:320px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; color:var(--text-muted); }
.term::-webkit-scrollbar { width:6px; } .term::-webkit-scrollbar-track { background:transparent; } .term::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

/* Modal */
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); z-index:100; justify-content:center; align-items:center; }
.overlay.show { display:flex; }
.modal { background:var(--bg-card); border:1px solid var(--border-accent); border-radius:10px; padding:24px; width:500px; max-height:80vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.4); }
.modal h2 { color:var(--accent); font-size:1.1em; margin-bottom:14px; font-weight:600; }
.modal .form-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.modal .form-row label { font-size:.9em; color:var(--text-muted); min-width:60px; text-align:right; }
.modal .form-row input, .modal .form-row select { flex:1; padding:8px 10px; background:var(--bg); border:1px solid var(--border); color:var(--text); font-family:inherit; font-size:.92em; border-radius:6px; }
.modal .form-row input:focus, .modal .form-row select:focus { outline:none; border-color:var(--accent); }
.modal textarea { width:100%; height:180px; padding:12px; background:var(--bg); border:1px solid var(--border); color:var(--text); font-family:"SF Mono",Consolas,monospace; font-size:13px; border-radius:6px; resize:vertical; margin-top:8px; }
.modal textarea:focus { outline:none; border-color:var(--accent); }
.modal .btn-row { display:flex; gap:8px; margin-top:14px; }

main { height:calc(100vh - 49px); overflow-y:auto; }
</style>
</head>
<body>
<script type="module">
import { h, render, Fragment } from 'https://esm.sh/preact@10.25.4';
import { useState, useEffect, useRef, useCallback } from 'https://esm.sh/preact@10.25.4/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(h);

const ENG = {inform7:'I7',zmachine:'Z',ink:'Ink',wwwbasic:'wwwBASIC',qbjc:'qbjc',applesoft:'Apple',bwbasic:'bwBASIC',jsdos:'DOS',twine:'Twine',sharpee:'Sharpee',rez:'Rez',unknown:'?'};
const BLBL = {present:'DONE',missing:'\u2014',stale:'STALE',failed:'FAIL','n/a':'n/a'};
const BCLS = {present:'badge-present',missing:'badge-missing',stale:'badge-stale',failed:'badge-failed','n/a':'badge-na'};
const NCLS = {present:'dag-node-present',missing:'dag-node-missing',stale:'dag-node-stale',failed:'dag-node-failed','n/a':'dag-node-na'};
const PORTMAN_PORT = 9000;
function localUrl(game){ return 'http://127.0.0.1:'+PORTMAN_PORT+'/'+game+'/play.html'; }
function liveUrl(game){ return 'https://johnesco.github.io/'+game+'/play.html'; }
const STEPS = ['compile','publish','register'];

function fileUrl(p){if(!p)return'';p=p.replace(/\\/g,'/');if(!p.startsWith('/'))p='/'+p;return'file://'+p;}

function Badge({status,detail,onClick}){
  return html`<span class="badge ${BCLS[status]||'badge-missing'}" title=${detail||''} onClick=${e=>{e.stopPropagation();onClick&&onClick();}}>${BLBL[status]||status}</span>`;
}

function Conn(){
  return html`<div class="dag-conn"><div class="dag-conn-line" /></div>`;
}

function DagNode({name,detail,linkUrl,status,running,onRunTo,onRunOnly,children}){
  const ncls = running ? 'dag-node-running' : (NCLS[status]||'dag-node-missing');
  const bCls = BCLS[status]||'badge-missing';
  const forceRef = useRef(null);
  const parts = (detail||'').split(' \u00b7 ');
  const detailEl = linkUrl && parts.length>0
    ? html`<div class="node-detail"><a href=${linkUrl} onClick=${e=>e.stopPropagation()}>${parts[0]}</a>${parts.length>1?' \u00b7 '+parts.slice(1).join(' \u00b7 '):''}</div>`
    : detail ? html`<div class="node-detail">${detail}</div>` : null;

  return html`<div class="dag-node ${ncls}">
    <div class="node-head">
      <span class="node-name">${name}</span>
      <span class="node-badge ${bCls}">${BLBL[status]||status}</span>
    </div>
    ${detailEl}
    ${children}
    ${onRunTo && html`<div class="node-btns">
      <button class="btn" onClick=${e=>{e.stopPropagation();onRunTo(forceRef.current?.checked);}}>${name}</button>
      ${onRunOnly && html`<a class="only-link" onClick=${e=>{e.stopPropagation();onRunOnly(forceRef.current?.checked);}}>only</a>`}
      <span class="spacer" />
      <label class="force-label" onClick=${e=>e.stopPropagation()}><input type="checkbox" ref=${forceRef} /> Force</label>
    </div>`}
  </div>`;
}

function FileEditor({game,type,label,placeholder}){
  const [content,setContent]=useState('');
  const [orig,setOrig]=useState('');
  const [exists,setExists]=useState(false);
  const [loading,setLoading]=useState(true);
  const [open,setOpen]=useState(false);

  useEffect(()=>{
    setLoading(true);
    fetch('/api/file/'+game+'/'+type).then(r=>r.json()).then(d=>{
      setContent(d.content||''); setOrig(d.content||''); setExists(d.exists); setLoading(false);
      if(d.content) setOpen(true);
    }).catch(()=>setLoading(false));
  },[game,type]);

  const dirty = content !== orig;

  useEffect(()=>{
    window.__fileEditors = window.__fileEditors || {};
    window.__fileEditors[game+'_'+type] = {
      dirty: () => content !== orig,
      save: async () => {
        if(content === orig) return;
        await fetch('/api/file/'+game+'/'+type, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content})});
        setOrig(content); setExists(true);
      }
    };
  });

  return html`<div style=${{marginTop:'6px'}} onClick=${e=>e.stopPropagation()}>
    <div style=${{fontSize:'.85em',color:'var(--text-dim)',cursor:'pointer',display:'flex',alignItems:'center',gap:'4px'}} onClick=${()=>setOpen(!open)}>
      <span>${open?'\u25BE':'\u25B8'}</span>
      <span>${label||type}</span>
      ${dirty && html`<span style=${{color:'var(--yellow)',marginLeft:'4px'}}>modified</span>`}
      ${!exists && !loading && html`<span style=${{color:'var(--text-dim)',marginLeft:'4px'}}>(new)</span>`}
    </div>
    ${open && html`<textarea
      style=${{width:'100%',height:'140px',marginTop:'4px',padding:'8px',background:'var(--bg)',border:'1px solid var(--border)',color:'var(--text)',fontFamily:'"SF Mono",Consolas,monospace',fontSize:'13px',lineHeight:'1.5',borderRadius:'4px',resize:'vertical'}}
      value=${content} onInput=${e=>setContent(e.target.value)} placeholder=${placeholder||''} />`}
  </div>`;
}

function Terminal({game}){
  const termRef=useRef(null);
  const [status,setStatus]=useState({cls:'',text:''});
  const [running,setRunning]=useState(false);

  useEffect(()=>{
    const api={
      clear(){if(termRef.current)termRef.current.textContent='';setStatus({cls:'',text:''});},
      append(text){if(termRef.current){termRef.current.textContent+=text;termRef.current.scrollTop=termRef.current.scrollHeight;}},
      setStatus(cls,text){setStatus({cls,text});},
      setRunning(v){setRunning(v);},
    };
    window.__term=window.__term||{};
    window.__term[game]=api;
    return ()=>{if(window.__term)delete window.__term[game];};
  },[game]);

  return html`<div>
    <div class="output-bar">
      <h4>Output</h4>
      <span class="job-status ${status.cls}">${status.text}</span>
      <div class="output-btns">
        <button class="btn" disabled=${!running} onClick=${()=>window.__curJob&&fetch('/api/stop/'+window.__curJob,{method:'POST'})}>Stop</button>
        <button class="btn" onClick=${()=>{if(termRef.current)termRef.current.textContent='';setStatus({cls:'',text:''});}}>Clear</button>
      </div>
    </div>
    <pre class="term" ref=${termRef} />
  </div>`;
}

function DAG({project,onAction,runningSteps}){
  const a=project.artifacts;
  const rs=runningSteps||[];
  const runTo=(step,force)=>onAction('run-to',project,force,{target:step});
  const runOnly=(step,force)=>onAction(step,project,force);

  return html`<div class="dag">
    <${DagNode} name="Source" detail=${project.sourceFile||'n/a'} linkUrl=${project.sourceFile?fileUrl(project.dir+'/'+project.sourceFile):''} status="present" />
    <${Conn} />
    <${DagNode} name="Compile" detail=${project.compileScripts||a.compile.detail} linkUrl=${a.compile.path?fileUrl(a.compile.path):''} status=${a.compile.status} running=${rs.includes('compile')} onRunTo=${f=>runTo('compile',f)} onRunOnly=${f=>runOnly('compile',f)} />
    <${Conn} />
    <${DagNode} name="Publish" detail=${a.published.detail} status=${a.published.status} running=${rs.includes('publish')} onRunTo=${f=>runTo('publish',f)} onRunOnly=${f=>runOnly('publish',f)} />
    <${Conn} />
    <${DagNode} name="Register" detail=${a.registered.detail} status=${a.registered.status} running=${rs.includes('register')} onRunTo=${f=>runTo('register',f)} onRunOnly=${f=>runOnly('register',f)} />
    <div style=${{marginTop:'10px',display:'flex',flexDirection:'column',gap:'6px'}}>
      <button class="btn btn-primary" style=${{width:'100%'}} onClick=${e=>{e.stopPropagation();runTo('register',false);}}>Ship All</button>
      <div style=${{display:'flex',gap:'6px'}}>
        <a class="btn" style=${{flex:1,textAlign:'center',textDecoration:'none'}} href=${localUrl(project.name)} target="_blank" onClick=${e=>e.stopPropagation()}>Open Local</a>
        <a class="btn" style=${{flex:1,textAlign:'center',textDecoration:'none'}} href=${liveUrl(project.name)} target="_blank" onClick=${e=>e.stopPropagation()}>Open Live</a>
      </div>
    </div>
  </div>`;
}

function MetaForm({project,formRef}){
  const p=project;
  const t=p.title||p.name.replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  return html`<div class="meta-form" ref=${formRef}>
    <label>Title</label><input type="text" name="title" defaultValue=${t} />
    <label>Sub</label><input type="text" name="meta" defaultValue=${p.meta||'An Interactive Fiction'} />
    <label>Desc</label><input type="text" name="description" defaultValue=${p.description||'An interactive fiction game.'} />
    <span class="chk"><input type="checkbox" name="sound" defaultChecked=${p.sound} /> Sound</span>
  </div>`;
}

function ExpandedContent({project,onAction,runningSteps}){
  const formRef=useRef(null);

  const handleAction=useCallback(async(action,proj,force,extra)=>{
    const eds = window.__fileEditors || {};
    for(const key of [proj.name+'_source']){
      const ed = eds[key];
      if(ed && ed.dirty()) await ed.save();
    }
    const form=formRef.current;
    const meta={};
    if(form){
      meta.title=form.querySelector('[name=title]')?.value||'';
      meta.meta=form.querySelector('[name=meta]')?.value||'';
      meta.description=form.querySelector('[name=description]')?.value||'';
      meta.sound=form.querySelector('[name=sound]')?.checked||false;
    }
    onAction(action,proj.name,force,{...meta,...(extra||{})});
  },[onAction]);

  return html`<div class="expanded-content">
    <div class="expanded-left">
      <${DAG} project=${project} onAction=${handleAction} runningSteps=${runningSteps} />
    </div>
    <div class="expanded-right">
      <${MetaForm} project=${project} formRef=${formRef} />
      <${FileEditor} game=${project.name} type="source" label=${project.sourceFile||'source'} placeholder="Paste source code..." />
      <${Terminal} game=${project.name} key=${project.name} />
    </div>
  </div>`;
}

function App(){
  const [projects,setProjects]=useState([]);
  const [expanded,setExpanded]=useState(null);
  const [showModal,setShowModal]=useState(false);
  const [runningSteps,setRunningSteps]=useState([]);

  const fetchProjects=useCallback(async()=>{
    const r=await fetch('/api/projects'); setProjects(await r.json());
  },[]);
  useEffect(()=>{fetchProjects();},[]);

  const runTask=useCallback(async(action,game,force,meta)=>{
    setExpanded(game);
    await new Promise(r=>setTimeout(r,60));

    const target = meta?.target||action;
    if (action==='run-to') {
      const idx = STEPS.indexOf(target);
      setRunningSteps(idx>=0 ? STEPS.slice(0,idx+1) : [target]);
    } else {
      setRunningSteps([action]);
    }

    const api=window.__term&&window.__term[game];
    if(api){api.clear();api.setRunning(true);api.setStatus('job-status st-run','Running...');}

    const body={task:action,game,force:!!force,...(meta||{})};
    const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await r.json();

    if(data.error){
      if(api){api.append('[ERROR] '+data.error+'\n');api.setStatus('job-status st-err','Error');api.setRunning(false);}
      setRunningSteps([]); return;
    }

    window.__curJob=data.jobId;
    if(api){data.commands.forEach(c=>api.append('$ '+c+'\n'));api.append('\n');}

    const es=new EventSource('/api/stream/'+data.jobId);
    es.onmessage=e=>{const d=JSON.parse(e.data);if(d.line&&api)api.append(d.line.replace(/\x1b\[[0-9;]*m/g,''));};
    es.addEventListener('done',e=>{
      const d=JSON.parse(e.data); es.close(); window.__curJob=null; setRunningSteps([]);
      if(api){api.setRunning(false);api.setStatus(d.status==='done'?'job-status st-done':'job-status st-err',d.status==='done'?'Done':'Failed (exit '+d.exitCode+')');}
      fetchProjects();
    });
    es.onerror=()=>{es.close();window.__curJob=null;setRunningSteps([]);if(api)api.setRunning(false);};
  },[fetchProjects]);

  const badgeClick=useCallback((action,game)=>{
    const p=projects.find(x=>x.name===game);
    runTask(action,game,false,p?{title:p.title,meta:p.meta,description:p.description,sound:p.sound}:{});
  },[projects,runTask]);

  return html`<div>
    <header>
      <h1>IF Hub</h1><span class="sub">Dashboard</span><span class="spacer" />
      <button class="hdr-btn" onClick=${()=>setShowModal(true)}>+ New Game</button>
      <button class="hdr-btn" onClick=${fetchProjects}>Refresh</button>
    </header>
    <main><table class="matrix">
      <thead><tr>
        <th class="col-game">Game</th><th class="col-engine">Engine</th>
        <th class="col-status">Compile</th>
        <th class="col-status">Publish</th><th class="col-status">Register</th>
        <th class="col-actions">Actions</th>
      </tr></thead>
      <tbody>${projects.map(p=>{
        const a=p.artifacts, isExp=expanded===p.name;
        return html`<${Fragment} key=${p.name}>
          <tr class=${isExp?'row-sel':''} onClick=${e=>{if(!e.target.closest('.badge,.btn,.force-label'))setExpanded(isExp?null:p.name);}}>
            <td><a class="game-name" href=${fileUrl(p.dir)} title=${p.dir} onClick=${e=>e.stopPropagation()}>${p.name}</a><span class="play-links" onClick=${e=>e.stopPropagation()}><a class="play-link" href=${localUrl(p.name)} target="_blank" title="Open in Portman (local)">local</a><a class="play-link" href=${liveUrl(p.name)} target="_blank" title="Open on GitHub Pages (live)">live</a></span></td>
            <td><span class="engine-tag">${ENG[p.engine]||p.engine}</span></td>
            <td><${Badge} status=${a.compile.status} detail=${a.compile.detail} onClick=${()=>badgeClick('compile',p.name)} /></td>

            <td><${Badge} status=${a.published.status} detail=${a.published.detail} onClick=${()=>badgeClick('publish',p.name)} /></td>
            <td><${Badge} status=${a.registered.status} detail=${a.registered.detail} onClick=${()=>badgeClick('register',p.name)} /></td>
            <td><button class="btn btn-primary" disabled=${p.overallStatus==='ready'} onClick=${e=>{e.stopPropagation();runTask('run-to',p.name,false,{target:'register',title:p.title,meta:p.meta,description:p.description});}}>Ship All</button></td>
          </tr>
          ${isExp && html`<tr class="expanded-row"><td colSpan="6">
            <${ExpandedContent} project=${p} onAction=${runTask} runningSteps=${runningSteps} />
          </td></tr>`}
        </${Fragment}>`;
      })}</tbody>
    </table></main>
    ${showModal && html`<${CreateModal} onClose=${()=>setShowModal(false)} onCreated=${async(n)=>{await fetchProjects();setExpanded(n);}} />`}
  </div>`;
}

function CreateModal({onClose,onCreated}){
  const [name,setName]=useState('');const [engine,setEngine]=useState('inform7');const [source,setSource]=useState('');
  const create=async()=>{
    if(!name.trim()){alert('Enter a game name.');return;}
    const r=await fetch('/api/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.trim(),source,engine})});
    const d=await r.json();if(d.error){alert(d.error);return;}onClose();onCreated(name.trim());
  };
  return html`<div class="overlay show" onClick=${e=>{if(e.target===e.currentTarget)onClose();}}>
    <div class="modal">
      <h2>New Game</h2>
      <div class="form-row"><label>Name</label><input type="text" value=${name} onInput=${e=>setName(e.target.value)} placeholder="my-game" /></div>
      <div class="form-row"><label>Engine</label><select value=${engine} onChange=${e=>setEngine(e.target.value)}>
        <option value="inform7">Inform 7</option><option value="ink">Ink</option><option value="wwwbasic">wwwBASIC</option>
        <option value="qbjc">qbjc</option><option value="applesoft">Applesoft</option><option value="sharpee">Sharpee</option><option value="rez">Rez</option>
      </select></div>
      <label style="font-size:.82em;color:var(--text-muted)">Source (optional)</label>
      <textarea value=${source} onInput=${e=>setSource(e.target.value)} placeholder="Paste source code or leave blank..." />
      <div class="btn-row"><button class="btn btn-primary" onClick=${create}>Create</button><button class="btn" onClick=${onClose}>Cancel</button></div>
    </div>
  </div>`;
}

render(html`<${App} />`, document.body);
</script>
</body>
</html>
