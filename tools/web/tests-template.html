<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tests</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ─── Design: transcript-first test viewer ─────────────────────────
 * Modeled on ifplayer's HTML report layout.
 * Default view reads like a game transcript (command → response).
 * Test details (assertions, drift, parser notes) are hidden behind
 * a secondary disclosure inside each turn.
 * Failed turns auto-expand so the user sees what broke immediately.
 * ─────────────────────────────────────────────────────────────────── */

:root {
  --bg: #0a0a0a;
  --fg: #d4c5a9;
  --muted: #665544;
  --pass: #8bab6e;
  --pass-bg: #141e12;
  --fail: #cc6644;
  --fail-bg: #1e1210;
  --warn: #cc8844;
  --line: #1e1a14;
  --hover: #161410;
  --accent: #c4b48a;
  --card-bg: #0e0e0c;
  --turn-bg: #141210;
  --turn-border: #1e1a14;
  --game-font: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
  --ui-font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 var(--ui-font);
  padding: 0;
}

/* ─── toolbar ──────────────────────────────────────────────────── */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 20px;
  background: #0c0c0a;
  border-bottom: 1px solid var(--line);
}

.toolbar button {
  background: var(--card-bg);
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 4px 12px;
  font: 12px var(--ui-font);
  cursor: pointer;
}

.toolbar button:hover { color: var(--accent); border-color: #2a2418; }
.toolbar button.active { color: var(--fail); border-color: var(--fail); }

.toolbar .search-box {
  background: var(--card-bg);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 4px 10px;
  font: 12px var(--mono);
  width: 200px;
}

.toolbar .search-box:focus { outline: none; border-color: #3a3020; }
.toolbar .spacer { flex: 1; }

.toolbar .total-badge {
  font: 12px var(--mono);
  padding: 3px 10px;
  border-radius: 4px;
}

.toolbar .total-badge.all-pass { color: var(--pass); background: var(--pass-bg); border: 1px solid #2a3a20; }
.toolbar .total-badge.has-fail { color: var(--fail); background: var(--fail-bg); border: 1px solid #3a2418; }

.search-hit { background: #3a3010; color: #ffdd88; border-radius: 2px; }
.search-hit.search-current { background: #5a4a20; outline: 1px solid #887744; }

/* ─── content area ─────────────────────────────────────────────── */
.content {
  padding: 16px 20px 64px;
  max-width: 1100px;
}

/* ─── summary card ─────────────────────────────────────────────── */
.summary {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  padding: 10px 16px;
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  margin-bottom: 20px;
  font-variant-numeric: tabular-nums;
}

.summary .item { display: flex; align-items: baseline; gap: 5px; }
.summary .num { font-size: 20px; font-weight: 600; font-family: var(--mono); }
.summary .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.summary .pass-num { color: var(--pass); }
.summary .fail-num { color: var(--fail); }

/* ─── test card (one per transcript) ───────────────────────────── */
details.test {
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  margin-bottom: 16px;
  overflow: hidden;
}

summary.test-summary {
  cursor: pointer;
  padding: 14px 20px;
  display: grid;
  grid-template-columns: 16px 24px minmax(140px, 1fr) auto;
  gap: 12px;
  align-items: center;
  user-select: none;
  list-style: none;
  background: #1a1610;
  color: #e8dcc0;
  border-left: 5px solid var(--pass);
}

details.test[data-status="fail"] summary.test-summary {
  background: #1e1210;
  border-left-color: var(--fail);
}

summary.test-summary::-webkit-details-marker { display: none; }
summary.test-summary::before {
  content: "▶";
  color: rgba(255,255,255,0.4);
  font-size: 11px;
  transition: transform 0.15s;
}

details.test[open] > summary.test-summary::before { transform: rotate(90deg); }
summary.test-summary:hover { filter: brightness(1.15); }

.test-glyph { font-size: 18px; font-weight: 700; }
.test-glyph.pass { color: var(--pass); }
.test-glyph.fail { color: var(--fail); }

.test-name { font-weight: 700; font-size: 17px; letter-spacing: 0.2px; }

.test-meta {
  color: rgba(255,255,255,0.6);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  font-family: var(--mono);
  white-space: nowrap;
}

.test-body { background: var(--card-bg); }

.test-desc {
  padding: 10px 20px;
  font-size: 13px;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
  font-style: italic;
}

/* ─── turn rows (transcript-style) ─────────────────────────────── */
.transcript {
  list-style: none;
  margin: 0;
  padding: 0;
}

li.turn { border-bottom: 1px solid var(--line); }
li.turn:last-child { border-bottom: none; }

details.turn-detail[data-status="fail"] { background: var(--fail-bg); }

summary.turn-row {
  cursor: pointer;
  display: grid;
  grid-template-columns:
    12px              /* disclosure ▶ */
    42px              /* line # or T:N */
    minmax(120px, auto) /* > command */
    1fr               /* room (right-aligned) */
    70px              /* score */
    36px              /* delta */
    44px              /* WIN/LOSE */
    80px;             /* asserts */
  gap: 10px;
  padding: 8px 16px;
  align-items: center;
  font: 13px var(--ui-font);
  background: var(--turn-bg);
  border-top: 1px solid var(--turn-border);
  user-select: none;
  list-style: none;
}

li.turn:first-child summary.turn-row { border-top: none; }

details.turn-detail[data-status="fail"] summary.turn-row {
  background: var(--fail-bg);
  border-top-color: #2a1a14;
}

summary.turn-row::-webkit-details-marker { display: none; }
summary.turn-row::before {
  content: "▶";
  color: var(--muted);
  font-size: 8px;
  transition: transform 0.1s;
}

details.turn-detail[open] > summary.turn-row::before { transform: rotate(90deg); }
summary.turn-row:hover { background: var(--hover); }
details.turn-detail[data-status="fail"] summary.turn-row:hover { background: #261810; }

.turn-num {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-family: var(--mono);
  font-size: 12px;
}

.turn-cmd {
  font-weight: 600;
  color: var(--accent);
  font-family: var(--mono);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.turn-room {
  color: #9b7abf;
  font-family: var(--mono);
  font-size: 12px;
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.turn-score { color: var(--warn); font-variant-numeric: tabular-nums; font-size: 12px; }
.turn-delta { color: var(--pass); font-weight: 600; font-variant-numeric: tabular-nums; font-size: 12px; }
.turn-delta.neg { color: var(--fail); }

.turn-outcome { font-weight: 700; font-size: 11px; }
.turn-outcome.win { color: var(--pass); }
.turn-outcome.lose { color: var(--fail); }
.turn-outcome.end { color: var(--muted); }

.turn-asserts {
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
  font-size: 12px;
}

.turn-asserts .pass { color: var(--pass); font-weight: 600; }
.turn-asserts .fail { color: var(--fail); font-weight: 600; }

/* ─── turn body: game response (transcript-style) ──────────────── */
.turn-body { background: var(--card-bg); }

pre.turn-response {
  margin: 0;
  padding: 12px 20px 12px 32px;
  background: var(--card-bg);
  font-family: var(--game-font);
  font-size: 13.5px;
  line-height: 1.6;
  color: #c8bca0;
  white-space: pre-wrap;
  word-wrap: break-word;
  border-top: 1px dashed var(--line);
}

pre.turn-response .room-title {
  font-weight: 700;
  color: var(--accent);
}

pre.turn-response .score-line {
  color: var(--warn);
  font-style: italic;
}

/* ─── turn extras: assertions, drift, parser notes ─────────────── */
details.turn-extras {
  border-top: 1px dashed var(--line);
}

summary.turn-extras-summary {
  cursor: pointer;
  padding: 6px 16px 6px 32px;
  font-size: 12px;
  color: var(--muted);
  user-select: none;
  list-style: none;
  font-family: var(--ui-font);
}

summary.turn-extras-summary::-webkit-details-marker { display: none; }
summary.turn-extras-summary::before { content: "▸ "; font-size: 10px; }
details.turn-extras[open] > summary.turn-extras-summary::before { content: "▾ "; }
summary.turn-extras-summary:hover { background: var(--hover); }

.turn-extras-body {
  padding: 8px 20px 12px 32px;
  background: #080808;
}

.turn-extras-body h4 {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin: 10px 0 4px;
}

.turn-extras-body h4:first-child { margin-top: 0; }

/* ─── assertions list ──────────────────────────────────────────── */
ul.assertions { margin: 0; padding: 0; list-style: none; }

ul.assertions li {
  padding: 4px 0;
  font-size: 12.5px;
  position: relative;
  padding-left: 18px;
  line-height: 1.4;
}

ul.assertions li.pass::before {
  content: "✓"; position: absolute; left: 0;
  color: var(--pass); font-weight: 700; font-size: 13px;
}

ul.assertions li.fail::before {
  content: "✗"; position: absolute; left: 0;
  color: var(--fail); font-weight: 700; font-size: 13px;
}

ul.assertions li .a-label { font-weight: 600; }
ul.assertions li.pass .a-label { color: var(--pass); }
ul.assertions li.fail .a-label { color: var(--fail); }

ul.assertions li .a-pattern {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  margin-left: 6px;
  font-weight: 400;
}

ul.assertions li .a-detail {
  display: block;
  color: var(--fail);
  margin-top: 2px;
  font-size: 11px;
  font-family: var(--mono);
}

/* ─── comment blocks ───────────────────────────────────────────── */
.turn-comment {
  padding: 8px 20px 8px 32px;
  font-size: 12px;
  color: var(--muted);
  font-style: italic;
  border-top: 1px dashed var(--line);
  white-space: pre-wrap;
}

/* ─── drift diff ───────────────────────────────────────────────── */
.drift-diff {
  background: #0c0c0a;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 8px 12px;
  font: 12px var(--game-font);
  line-height: 1.6;
}

.drift-diff .equal { color: var(--muted); }
.drift-diff .del { color: var(--fail); background: var(--fail-bg); text-decoration: line-through; padding: 0 2px; border-radius: 2px; }
.drift-diff .ins { color: var(--pass); background: var(--pass-bg); padding: 0 2px; border-radius: 2px; }

.parser-error {
  font: 12px var(--mono);
  color: var(--warn);
  padding: 1px 0;
}

/* ─── loading / empty ──────────────────────────────────────────── */
.loading, .empty-msg, .error-msg {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}

.empty-msg h2 { color: var(--accent); font-size: 16px; margin-bottom: 8px; }
.empty-msg code { color: var(--warn); font-family: var(--mono); }

/* ─── hidden by filter ─────────────────────────────────────────── */
.hidden-by-filter { display: none !important; }

/* ─── responsive ───────────────────────────────────────────────── */
@media (max-width: 700px) {
  summary.turn-row {
    grid-template-columns: 12px 42px 1fr auto;
  }
  .turn-room, .turn-score, .turn-delta, .turn-outcome { display: none; }
  .content { padding: 12px 10px 40px; }
}
</style>
</head>
<body>

<div class="toolbar">
  <button id="btn-expand-all">Expand all</button>
  <button id="btn-collapse-all">Collapse all</button>
  <button id="btn-failures-only">Failures only</button>
  <input type="text" class="search-box" id="search" placeholder="Search... (Ctrl+F)">
  <span class="spacer"></span>
  <span class="total-badge all-pass" id="total-badge" style="display:none;"></span>
</div>

<div class="content" id="content">
  <div class="loading"><em>Loading test results...</em></div>
</div>

<script>
var DATA_URL = 'test-results.json';
var testData = null;
var failuresOnly = false;

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ── Format assertion into readable text ── */
function fmtAssertion(a) {
  var t = a.type || '', v = a.value || '';
  switch (t) {
    case 'ok-contains': return 'Contains "' + v + '"';
    case 'ok-not-contains': return 'Not contains "' + v + '"';
    case 'ok-matches': return 'Matches /' + v + '/';
    case 'ok-not-matches': return 'Not matches /' + v + '/';
    case 'ok-starts-with': return 'Starts with "' + v + '"';
    case 'ok-ends-with': return 'Ends with "' + v + '"';
    case 'ok-equals': return 'Equals "' + v + '"';
    case 'event': return 'Event: ' + v;
    case 'event-not': return 'No event: ' + v;
    case 'state': return 'State: ' + v;
    case 'state-not': return 'Not state: ' + v;
    default: return t + (v ? ': ' + v : '');
  }
}

/* ── Classify output lines for room/score highlighting ── */
function renderOutput(text) {
  if (!text) return '';
  var lines = text.split('\n');
  var parts = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var trimmed = line.trim();
    // Room title: first non-empty line, capitalized, short, no period
    if (i === 0 && trimmed && trimmed.length < 80 && /^[A-Z]/.test(trimmed) && !/\.\s*$/.test(trimmed)) {
      var next = (i + 1 < lines.length) ? lines[i + 1] : '';
      if (/^You are |^You're |^$|^This is |^There is /.test(next)) {
        parts.push('<strong class="room-title">' + esc(line) + '</strong>');
        if (i < lines.length - 1) parts.push('\n');
        continue;
      }
    }
    // Score notification
    if (/\[Your score/i.test(line)) {
      parts.push('<span class="score-line">' + esc(line) + '</span>');
    } else {
      parts.push(esc(line));
    }
    if (i < lines.length - 1) parts.push('\n');
  }
  return parts.join('');
}

/* ── Format turn assertion badge ── */
function fmtTurnAsserts(cmd) {
  var asserts = cmd.assertions || [];
  if (asserts.length === 0) return '<span style="color:var(--muted)">—</span>';
  var passed = 0;
  for (var i = 0; i < asserts.length; i++) { if (asserts[i].passed) passed++; }
  var failed = asserts.length - passed;
  if (failed === 0) return '<span class="pass">✓ ' + passed + '/' + asserts.length + '</span>';
  if (passed === 0) return '<span class="fail">✗ ' + failed + '/' + asserts.length + '</span>';
  return '<span class="pass">✓ ' + passed + '/' + asserts.length + '</span> <span class="fail">✗ ' + failed + '/' + asserts.length + '</span>';
}

/* ── Build extras label ── */
function fmtExtrasLabel(cmd) {
  var bits = [];
  var asserts = cmd.assertions || [];
  var total = asserts.length;
  if (total) {
    var passed = 0;
    for (var i = 0; i < total; i++) { if (asserts[i].passed) passed++; }
    if (passed === total) bits.push(total + ' check' + (total !== 1 ? 's' : '') + ' ✓');
    else bits.push('<span style="color:var(--fail)">' + total + ' checks (' + (total - passed) + ' failed)</span>');
  } else {
    bits.push('no checks');
  }
  if (cmd.drift && cmd.drift.length > 0) bits.push('<span style="color:var(--warn)">drift</span>');
  if (cmd.parserErrors && cmd.parserErrors.length > 0) bits.push('<span style="color:var(--warn)">parser notes</span>');
  return bits.join('  ·  ');
}

/* ── Check if command failed ── */
function cmdFailed(cmd) {
  if (cmd.passed === false) return true;
  var a = cmd.assertions || [];
  for (var i = 0; i < a.length; i++) { if (!a[i].passed) return true; }
  return false;
}

/* ── Render one turn ── */
function renderTurn(cmd, idx) {
  var failed = cmdFailed(cmd);
  var status = failed ? 'fail' : 'pass';
  var openAttr = failed ? ' open' : '';

  // Turn row grid cells
  var num = '<span class="turn-num">' + (idx + 1) + '</span>';
  var cmdText = '<span class="turn-cmd">&gt; ' + esc(cmd.input) + '</span>';
  var room = cmd.room ? '<span class="turn-room">' + esc(cmd.room) + '</span>' : '<span class="turn-room"></span>';
  var score = cmd.score ? '<span class="turn-score">' + esc(cmd.score) + '</span>' : '<span class="turn-score"></span>';

  var deltaText = '', deltaCls = 'turn-delta';
  if (cmd.scoreDelta > 0) deltaText = '+' + cmd.scoreDelta;
  else if (cmd.scoreDelta < 0) { deltaText = '' + cmd.scoreDelta; deltaCls = 'turn-delta neg'; }
  var delta = '<span class="' + deltaCls + '">' + esc(deltaText) + '</span>';

  var outcomeText = '', outcomeCls = '';
  if (cmd.outcome === 'win') { outcomeText = 'WIN'; outcomeCls = 'win'; }
  else if (cmd.outcome === 'lose') { outcomeText = 'LOSE'; outcomeCls = 'lose'; }
  var outcome = '<span class="turn-outcome ' + outcomeCls + '">' + esc(outcomeText) + '</span>';

  var asserts = '<span class="turn-asserts">' + fmtTurnAsserts(cmd) + '</span>';

  var h = '';
  h += '<li class="turn">';
  h += '<details class="turn-detail"' + openAttr + ' data-status="' + status + '">';
  h += '<summary class="turn-row">';
  h += num + cmdText + room + score + delta + outcome + asserts;
  h += '</summary>';
  h += '<div class="turn-body">';

  // Game response — the transcript text (primary content)
  if (cmd.output) {
    h += '<pre class="turn-response">' + renderOutput(cmd.output) + '</pre>';
  }

  // Comment (from Sharpee .transcript files)
  if (cmd.comment) {
    h += '<div class="turn-comment">' + esc(cmd.comment) + '</div>';
  }

  // Extras: assertions, drift, parser notes — nested disclosure
  var extrasOpen = failed ? ' open' : '';
  h += '<details class="turn-extras"' + extrasOpen + '>';
  h += '<summary class="turn-extras-summary">' + fmtExtrasLabel(cmd) + '</summary>';
  h += '<div class="turn-extras-body">';

  // Assertions
  var cmdAsserts = cmd.assertions || [];
  if (cmdAsserts.length > 0) {
    h += '<h4>Checks</h4><ul class="assertions">';
    for (var a = 0; a < cmdAsserts.length; a++) {
      var assertion = cmdAsserts[a];
      var cls = assertion.passed ? 'pass' : 'fail';
      h += '<li class="' + cls + '">';
      h += '<span class="a-label">' + esc(fmtAssertion(assertion)) + '</span>';
      h += '</li>';
    }
    h += '</ul>';
  }

  // Drift
  if (cmd.drift && cmd.drift.length > 0) {
    h += '<h4>Drift — recorded vs observed</h4>';
    h += '<div class="drift-diff">';
    for (var d = 0; d < cmd.drift.length; d++) {
      var chunk = cmd.drift[d];
      var dCls = chunk.kind === 'equal' ? 'equal' : (chunk.kind === 'delete' ? 'del' : 'ins');
      h += '<span class="' + dCls + '">' + esc(chunk.text) + '</span> ';
    }
    h += '</div>';
  }

  // Parser errors
  if (cmd.parserErrors && cmd.parserErrors.length > 0) {
    h += '<h4>Parser notes</h4>';
    for (var pe = 0; pe < cmd.parserErrors.length; pe++) {
      h += '<div class="parser-error">' + esc(cmd.parserErrors[pe]) + '</div>';
    }
  }

  h += '</div></details>'; // /turn-extras
  h += '</div></details></li>'; // /turn-body, /turn-detail, /turn
  return h;
}

/* ── Render one test card ── */
function renderTest(tr, tIdx) {
  var failed = tr.summary.failed > 0;
  var status = failed ? 'fail' : 'pass';
  var glyph = failed ? '✗' : '✓';
  var openAttr = failed ? ' open' : ' open'; // always open tests

  var cmdCount = tr.commands.length;
  var totalAsserts = 0, passedAsserts = 0;
  for (var c = 0; c < cmdCount; c++) {
    var a = tr.commands[c].assertions || [];
    totalAsserts += a.length;
    for (var i = 0; i < a.length; i++) { if (a[i].passed) passedAsserts++; }
  }

  var metaBits = [];
  metaBits.push(cmdCount + ' cmd' + (cmdCount !== 1 ? 's' : ''));
  metaBits.push(passedAsserts + '/' + totalAsserts + ' ✓');
  if (tr.summary.duration != null) {
    metaBits.push(tr.summary.duration < 1000 ? tr.summary.duration + 'ms' : (tr.summary.duration / 1000).toFixed(1) + 's');
  }

  var h = '';
  h += '<details class="test" data-status="' + status + '"' + openAttr + ' data-test-idx="' + tIdx + '">';
  h += '<summary class="test-summary">';
  h += '<span class="test-glyph ' + status + '">' + glyph + '</span>';
  h += '<span class="test-name">' + esc(tr.title || tr.file || 'Test ' + (tIdx + 1)) + '</span>';
  h += '<span class="test-meta">' + metaBits.join(' · ') + '</span>';
  h += '</summary>';
  h += '<div class="test-body">';

  if (tr.description) {
    h += '<div class="test-desc">' + esc(tr.description) + '</div>';
  }

  h += '<ul class="transcript">';
  for (var c2 = 0; c2 < tr.commands.length; c2++) {
    h += renderTurn(tr.commands[c2], c2);
  }
  h += '</ul>';

  h += '</div></details>';
  return h;
}

/* ── Compute actual assertion/command totals from transcripts ── */
function computeTotals() {
  var transcripts = testData.transcripts || [];
  var cmds = 0, cmdPass = 0, cmdFail = 0, asserts = 0, assertPass = 0;
  for (var t = 0; t < transcripts.length; t++) {
    var tr = transcripts[t];
    for (var c = 0; c < tr.commands.length; c++) {
      cmds++;
      var cmd = tr.commands[c];
      var failed = cmdFailed(cmd);
      if (failed) cmdFail++; else cmdPass++;
      var a = cmd.assertions || [];
      asserts += a.length;
      for (var i = 0; i < a.length; i++) { if (a[i].passed) assertPass++; }
    }
  }
  return { cmds: cmds, cmdPass: cmdPass, cmdFail: cmdFail, asserts: asserts, assertPass: assertPass,
           skipped: (testData.summary || {}).totalSkipped || 0,
           tests: transcripts.length };
}

/* ── Render summary bar ── */
function renderSummaryBar() {
  var t = computeTotals();

  var h = '<div class="summary">';
  h += '<div class="item"><span class="num">' + t.tests + '</span><span class="label">test' + (t.tests !== 1 ? 's' : '') + '</span></div>';
  h += '<div class="item"><span class="num">' + t.cmds + '</span><span class="label">command' + (t.cmds !== 1 ? 's' : '') + '</span></div>';
  h += '<div class="item"><span class="num pass-num">' + t.assertPass + '</span><span class="label">passed</span></div>';
  if (t.asserts - t.assertPass > 0) h += '<div class="item"><span class="num fail-num">' + (t.asserts - t.assertPass) + '</span><span class="label">failed</span></div>';
  if (t.skipped) h += '<div class="item"><span class="num">' + t.skipped + '</span><span class="label">skipped</span></div>';
  h += '<div class="item"><span class="num">' + t.assertPass + '/' + t.asserts + '</span><span class="label">checks</span></div>';
  h += '</div>';
  return h;
}

/* ── Render all ── */
function renderAll() {
  if (!testData || !testData.transcripts) return '<div class="empty-msg"><h2>No test results found</h2><p>Place a <code>test-results.json</code> file in this directory.</p></div>';

  var h = renderSummaryBar();

  for (var t = 0; t < testData.transcripts.length; t++) {
    h += renderTest(testData.transcripts[t], t);
  }
  return h;
}

/* ── Update title ── */
function updateTitle() {
  if (!testData) return;
  var title = 'Tests';
  if (testData.storyId) title += ' — ' + testData.storyId;
  document.title = title;
}

/* ── Update total badge ── */
function updateBadge() {
  var badge = document.getElementById('total-badge');
  if (!testData) { badge.style.display = 'none'; return; }
  var t = computeTotals();
  badge.style.display = '';
  badge.textContent = t.assertPass + '/' + t.asserts + ' passed';
  badge.className = (t.asserts - t.assertPass) > 0 ? 'total-badge has-fail' : 'total-badge all-pass';
}

/* ── Failures filter ── */
function applyFilter() {
  if (!failuresOnly) {
    document.querySelectorAll('.hidden-by-filter').forEach(function(el) { el.classList.remove('hidden-by-filter'); });
    return;
  }
  // Hide passing turns
  document.querySelectorAll('li.turn').forEach(function(el) {
    var det = el.querySelector('.turn-detail');
    if (det && det.getAttribute('data-status') === 'pass') el.classList.add('hidden-by-filter');
    else el.classList.remove('hidden-by-filter');
  });
  // Hide all-pass test cards
  document.querySelectorAll('details.test').forEach(function(el) {
    if (el.getAttribute('data-status') === 'pass') el.classList.add('hidden-by-filter');
    else el.classList.remove('hidden-by-filter');
  });
}

/* ── Search ── */
var searchHits = [], currentHit = -1;

function clearSearch() {
  document.querySelectorAll('.search-hit').forEach(function(el) { el.outerHTML = el.textContent; });
  searchHits = []; currentHit = -1;
}

function highlightMatches(el, query) {
  var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  var lower = query.toLowerCase();
  var nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(function(node) {
    var text = node.textContent;
    var idx = text.toLowerCase().indexOf(lower);
    if (idx === -1) return;
    var span = document.createElement('span');
    span.className = 'search-hit';
    span.textContent = text.slice(idx, idx + query.length);
    var parent = node.parentNode;
    if (idx > 0) parent.insertBefore(document.createTextNode(text.slice(0, idx)), node);
    parent.insertBefore(span, node);
    var after = text.slice(idx + query.length);
    if (after) parent.insertBefore(document.createTextNode(after), node);
    parent.removeChild(node);
  });
}

function doSearch(query) {
  clearSearch();
  if (!query || query.length < 2) return;
  var content = document.getElementById('content');
  content.querySelectorAll('.test-name, .test-desc, .turn-cmd, .turn-response, .a-label, .turn-comment').forEach(function(el) {
    if (el.textContent.toLowerCase().includes(query.toLowerCase())) highlightMatches(el, query);
  });
  searchHits = Array.from(document.querySelectorAll('.search-hit'));
  if (searchHits.length > 0) {
    currentHit = 0;
    searchHits[0].classList.add('search-current');
    searchHits[0].scrollIntoView({ block: 'center' });
  }
}

function nextHit() {
  if (!searchHits.length) return;
  searchHits[currentHit].classList.remove('search-current');
  currentHit = (currentHit + 1) % searchHits.length;
  searchHits[currentHit].classList.add('search-current');
  searchHits[currentHit].scrollIntoView({ block: 'center' });
}

function prevHit() {
  if (!searchHits.length) return;
  searchHits[currentHit].classList.remove('search-current');
  currentHit = (currentHit - 1 + searchHits.length) % searchHits.length;
  searchHits[currentHit].classList.add('search-current');
  searchHits[currentHit].scrollIntoView({ block: 'center' });
}

/* ── Init ── */
async function init() {
  var content = document.getElementById('content');
  try {
    var resp = await fetch(DATA_URL);
    if (!resp.ok) throw { notFound: true };
    testData = await resp.json();
  } catch (e) {
    if (e.notFound) {
      testData = null;
      content.innerHTML = '<div class="empty-msg"><h2>No test results found</h2><p>Place a <code>test-results.json</code> file in this directory.</p></div>';
      return;
    }
    content.innerHTML = '<div class="error-msg">Failed to load test results. ' + esc(e.message || String(e)) + '</div>';
    return;
  }

  updateTitle();
  updateBadge();
  content.innerHTML = renderAll();
  applyFilter();

  // Expand all / Collapse all
  document.getElementById('btn-expand-all').addEventListener('click', function() {
    document.querySelectorAll('details.turn-detail').forEach(function(d) { d.open = true; });
  });
  document.getElementById('btn-collapse-all').addEventListener('click', function() {
    document.querySelectorAll('details.turn-detail').forEach(function(d) { d.open = false; });
  });

  // Failures only
  document.getElementById('btn-failures-only').addEventListener('click', function() {
    failuresOnly = !failuresOnly;
    this.classList.toggle('active', failuresOnly);
    applyFilter();
  });

  // Search
  var searchInput = document.getElementById('search');
  var debounce;
  searchInput.addEventListener('input', function() {
    clearTimeout(debounce);
    var self = this;
    debounce = setTimeout(function() { doSearch(self.value); }, 200);
  });
  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); if (e.shiftKey) prevHit(); else nextHit(); }
    if (e.key === 'Escape') { clearSearch(); this.value = ''; this.blur(); }
  });
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'f') { e.preventDefault(); searchInput.focus(); searchInput.select(); }
  });
}

init();
</script>
