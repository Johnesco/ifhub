<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interactive Fiction &mdash; Source &amp; Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="app.css">
<script src="themes.js"></script>
<script src="hub.js"></script>
<script>initTheme('app');</script>
</head>
<body>

<!-- ===== TOP TOOLBAR ===== -->
<div class="game-toolbar">
  <div class="toolbar-selectors">
    <label for="hub-select" class="toolbar-label">Hub</label>
    <select id="hub-select"></select>
    <label for="game-select" class="toolbar-label">Game</label>
    <select id="game-select"></select>
    <div class="view-toggles" id="view-toggles">
      <button class="view-toggle active" data-pane="game" title="Toggle game pane">&#9654;<span class="vt-label"> Game</span></button>
      <button class="view-toggle active" data-pane="source" title="Toggle source pane">&lt;/&gt;<span class="vt-label"> Source</span></button>
      <button class="view-toggle" data-pane="walkthrough" title="Toggle walkthrough pane">&#9776;<span class="vt-label"> Walk</span></button>
      <button class="view-toggle" data-pane="tests" title="Toggle tests pane" style="display:none">&#10003;<span class="vt-label"> Tests</span></button>
    </div>
    <label class="toolbar-label" id="theme-label">Theme</label>
    <div id="theme-picker"></div>
  </div>
  <span id="sound-controls" style="display:none;">
    <button id="mute-btn" title="Toggle sound">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <polygon points="6,9 2,9 2,15 6,15 11,19 11,5"/>
        <path class="sound-wave" d="M14,9.5 C14.8,10.3 15.3,11.1 15.3,12 C15.3,12.9 14.8,13.7 14,14.5"
          stroke="#aa9966" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path class="sound-wave" d="M16,7.5 C17.5,9 18.3,10.5 18.3,12 C18.3,13.5 17.5,15 16,16.5"
          stroke="#aa9966" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <line class="mute-x" x1="15" y1="9" x2="21" y2="15"
          stroke="#aa9966" stroke-width="2" stroke-linecap="round"/>
        <line class="mute-x" x1="21" y1="9" x2="15" y2="15"
          stroke="#aa9966" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <input type="range" id="volume-slider" min="0" max="100" value="70" title="Volume">
  </span>
  <div class="hamburger-wrap">
    <button class="tb-icon-btn" id="hamburger-btn" title="Menu">&#x2630;</button>
    <div class="hamburger-menu" id="hamburger-menu">
      <a id="library-link" href=".">Library</a>
      <a id="game-landing-link" href="#" style="display:none">Game Page</a>
      <a id="btn-fullpage" href="#">Full Page</a>
    </div>
  </div>
</div>

<!-- ===== GAME PANE ===== -->
<div id="game-pane">
  <iframe id="game-frame" src="about:blank" title="Interactive Fiction"></iframe>
</div>

<!-- ===== RESIZE HANDLE ===== -->
<div id="resize-handle"></div>

<!-- ===== SOURCE PANE ===== -->
<div id="source-pane" data-source-mode="inline">
  <div class="source-toolbar" id="source-toolbar">
    <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle outline">&#9664;</button>
    <span class="file-path" id="source-filepath">story.ni</span>
    <span class="line-count" id="line-count"></span>
    <span class="walkthrough-context" id="walkthrough-context">
      <span class="wt-status" id="wt-status"></span>
    </span>
  </div>
  <div class="source-with-nav">
    <div class="sidebar" id="nav-sidebar">
      <input type="text" class="search-box" id="search-source" placeholder="Search source...">
      <div class="nav" id="nav"></div>
    </div>
    <div class="source-main" id="source-main">
      <!-- code table rendered by JS -->
    </div>
  </div>
  <iframe id="source-browser-frame" src="about:blank" title="Source Browser"></iframe>
  <div id="walkthrough-content">
    <iframe id="walkthrough-frame" src="about:blank" title="Walkthrough"></iframe>
    <div id="walkthrough-unavailable">
      Walkthrough not yet available for this game.
    </div>
  </div>
  <div id="tests-content">
    <iframe id="tests-frame" src="about:blank" title="Tests"></iframe>
    <div id="tests-unavailable">
      Tests not available for this game.
    </div>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
